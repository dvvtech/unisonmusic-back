services:
  unisonmusic_api:        
    image: ghcr.io/dvvtech/unisonmusic-back:latest      
    environment:
      - ASPNETCORE_ENVIRONMENT=Prod      
    networks:
      - public-network5    
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:      
        - "traefik.enable=true"      
        - "traefik.http.routers.unisonmusic-api.rule=Host(`api.cloud-platform.pro`) && PathPrefix(`/unisonmusiс`)"
        - "traefik.http.routers.unisonmusic-api.entrypoints=websecure"      
        - "traefik.http.routers.unisonmusic-api.tls.certresolver=letsencrypt"     
        - "traefik.http.services.unisonmusic-api.loadbalancer.server.port=8080"
        - "traefik.http.middlewares.unisonmusic-stripprefix.stripprefix.prefixes=/unisonmusic"
        - "traefik.http.routers.unisonmusic-api.middlewares=unisonmusic-stripprefix"

networks:
  public-network5:
    external: true